name: Run QA

# Runs only when you start it: Actions tab → Run QA → Run workflow.
# Want it automatic? See "Run it on a schedule (optional)" in the README.
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Check this URL instead of the sites in qa.config.json (optional)'
        required: false

permissions:
  contents: read

concurrency:
  group: warden
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # security-events: write is only used by the optional "Upload SARIF" step (off unless the
    # repository variable UPLOAD_SARIF is 'true'). It can add code scanning alerts, nothing else.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The previous run's results, so the report can say what's new and what got fixed.
      - name: Restore previous results
        uses: actions/cache/restore@v4
        with:
          path: reports/last.json
          key: qa-last-${{ github.run_id }}
          restore-keys: qa-last-

      # Also writes a .sarif and a .junit.xml next to the report, and a summary on the run page.
      - name: Run QA
        run: node src/cli.js --format sarif,junit
        env:
          SITE_URL: ${{ inputs.site || secrets.SITE_URL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # AI summary (all optional). Non-secret settings can also go in the "ai" block of qa.config.json.
          AI_PROVIDER: ${{ vars.AI_PROVIDER || secrets.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL || secrets.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Chat notifications (all optional). Messages link to this run, where the report artifact is.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          REPORT_URL_BASE: ${{ vars.REPORT_URL_BASE }}

      # Optional: show issues under Security → Code scanning. Turn on by adding the repository
      # variable UPLOAD_SARIF = true (Settings → Secrets and variables → Actions → Variables).
      - name: Upload SARIF
        if: always() && vars.UPLOAD_SARIF == 'true' && hashFiles('reports/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/
          category: warden

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Save results for next run
        if: always() && hashFiles('reports/last.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/last.json
          key: qa-last-${{ github.run_id }}
