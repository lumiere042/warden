name: Run QA

# Runs only when you start it: Actions tab → Run QA → Run workflow.
# Want it automatic? See "Run it on a schedule (optional)" in the README.
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Check this URL instead of the sites in qa.config.json (optional)'
        required: false

permissions:
  contents: read

concurrency:
  group: website-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The previous run's results, so the report can say what's new and what got fixed.
      - name: Restore previous results
        uses: actions/cache/restore@v4
        with:
          path: reports/last.json
          key: qa-last-${{ github.run_id }}
          restore-keys: qa-last-

      - name: Run QA
        run: node src/cli.js
        env:
          SITE_URL: ${{ inputs.site || secrets.SITE_URL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # AI summary (all optional). Non-secret settings can also go in the "ai" block of qa.config.json.
          AI_PROVIDER: ${{ vars.AI_PROVIDER || secrets.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL || secrets.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Save results for next run
        if: always() && hashFiles('reports/last.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/last.json
          key: qa-last-${{ github.run_id }}
